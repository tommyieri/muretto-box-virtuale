<!DOCTYPE html>
<!--
  ARTICOLO — PAGINA DI COMPATIBILITA'.  Il canonico e' /articolo/<id>.html,
  pre-renderizzato da ai_lab/redazione/statico.py: li' il testo sta NELL'HTML e i
  crawler lo vedono.  Su hosting statico una query string non puo' scegliere un
  file, quindi articolo.html?id=... non poteva essere il canonico.
  Questa pagina resta perche' i link gia' condivisi non muoiano: e' 'noindex' e
  rimanda al nuovo indirizzo; se il rimando non parte (JS spento) rende comunque
  l'articolo come prima, leggendo demo/data/analisi/<id>.json.
-->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analisi — Muretto Box Virtuale</title>
<meta name="robots" content="noindex, follow">
<link rel="stylesheet" href="stile.css?v=040826b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23e80d2e%27/%3E%3Cpath d=%27M7 23V9h3.4L16 17l5.6-8H25v14h-3.5v-8.2L16.9 21h-1.8l-4.6-6.2V23z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html" aria-label="Muretto Box Virtuale — home">
    <span class="brand-mark"><span>M</span></span>
    <span class="brand-name"><b>MURETTO</b><small>BOX VIRTUALE</small></span>
  </a>
  <nav class="nav" aria-label="Sezioni">
    <a href="stagione.html">Stagione</a>
    <a href="live.html"><span class="dot-live"></span>Live</a>
    <a href="analisi.html">Analisi</a>
    <a href="statistiche.html">Statistiche</a>
  </nav>
</header>

<div class="wrap-scheda" style="padding-bottom:0">
  <a class="crumb" href="analisi.html">&larr; Analisi</a>
</div>

<article class="wrap-scheda art" id="art"></article>

<footer class="footer">
  <div class="footer-in">
    <span class="fbrand"><b>MURETTO</b><small>BOX VIRTUALE &middot; STAGIONE 2026</small></span>
    <nav>
      <a href="stagione.html">Stagione</a>
      <a href="live.html">Live</a>
      <a href="analisi.html">Analisi</a>
      <a href="statistiche.html">Statistiche</a>
    </nav>
  </div>
</footer>

<script type="module">
const el = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dataIt = d => { try { return new Date(d+'T12:00:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'}); } catch(e){ return d; } };

// Gemello JS di svg.py::titola(), applicato anche da statico.py alla pagina
// pre-renderizzata. Serviva anche QUI: questa e' la pagina di ripiego quando la
// statica manca, e senza <title>/role/aria-label uno screen reader annuncia un
// blocco di testi sparsi invece del nome del grafico. Idempotente: se il <title>
// c'e' gia' (SVG nato dopo l'accessibilita'), l'SVG torna intatto.
function titolaSvg(svg, didascalia){
  if (!svg || !didascalia) return svg || '';
  const i = svg.indexOf('>');
  if (!svg.trimStart().startsWith('<svg') || i < 0) return svg;
  let testa = svg.slice(0, i);
  const resto = svg.slice(i + 1);
  if (resto.trimStart().startsWith('<title')) return svg;
  const d = esc(didascalia);
  if (!testa.includes('role="img"')) testa += ' role="img"';
  if (!testa.includes('aria-label=')) testa += ` aria-label="${d}"`;
  return `${testa}><title>${d}</title>${resto}`;
}

function figura(f){
  if (!f) return '';
  // Gemella di statico.py::_figura — le due rese devono restare allineate.
  // La riga «Fonte: ...» non si rende piu' (decisione di Tommi, 4/8/2026): il campo
  // `fonte` resta nel JSON dell'articolo, e' sparita la resa.
  return `<figure class="art-fig">
    <div class="art-svg-wrap">${titolaSvg(f.svg, f.didascalia)}</div>
    <figcaption><span class="cap">${esc(f.didascalia)}</span></figcaption>
  </figure>`;
}

function sezione(s){
  return `<section class="art-sez">
    <div class="sez-tit"><span class="art-tag">${esc(s.tag)}</span> ${esc(s.titolo)}</div>
    <div class="art-prosa">${s.html}</div>
    ${figura(s.figura)}
  </section>`;
}

// NON SI RENDE PIU' (decisione di Tommi, 4/8/2026). La tabella «Dati ·
// Provenienza dei numeri» chiudeva ogni articolo con dieci righe di metodo, e da
// lettore ci arrivavi dopo la chiusa: la coda pesava quanto il corpo.
//
// Il DATO NON SI TOCCA: provenienza[] e fonti[] restano in demo/data/analisi/<id>.json,
// restano l'insieme su cui la guardia dei numeri decide che cosa la prosa puo'
// scrivere, e restano leggibili a chi apre il JSON. E' sparita la resa, non la
// tracciabilita'.
//
// Gemella di statico.py::_provenienza — le due rese devono restare allineate.
function provenienza(art){ return ''; }

async function boot(){
  const id = new URLSearchParams(location.search).get('id');
  if (!id){ el('art').innerHTML = `<div class="aggiornato">Articolo non indicato.</div>`; return; }

  // RIMANDO AL CANONICO. Se la pagina pre-renderizzata esiste ci si va (replace:
  // non sporca la cronologia, Indietro torna da dove sei venuto). Se non esiste
  // — es. una bozza mai resa — si continua a rendere qui, come prima.
  if (!/[/\\?#]/.test(id)){
    const dove = `articolo/${encodeURIComponent(id)}.html`;
    try {
      if ((await fetch(dove, {method:'HEAD'})).ok){ location.replace(dove + location.hash); return; }
    } catch(e){ /* offline o file assente: si rende qui sotto */ }
  }

  let art;
  try { art = await (await fetch(`data/analisi/${encodeURIComponent(id)}.json`)).json(); }
  catch(e){ el('art').innerHTML = `<div class="aggiornato">Articolo non trovato — <a href="analisi.html">torna all'analisi</a>.</div>`; return; }

  const ac = art.accent || 'var(--brand)';
  const stato = art.stato && art.stato !== 'pubblicato'
    ? `<span class="art-bozza">${esc(art.stato)}</span>` : '';
  const meta = [art.circuito, art.sessione].filter(Boolean).join(' · ');
  const tags = (art.tag||[]).map(t=>`<span class="art-chip">${esc(t)}</span>`).join('');

  el('art').innerHTML = `
    <header class="art-testa" style="--ac:${ac}">
      <div class="art-occhiello">${esc(art.occhiello)}${stato}</div>
      <h1 class="art-titolo">${esc(art.titolo)}</h1>
      <p class="art-sommario">${esc(art.sommario)}</p>
      <div class="art-riga">
        <span class="art-firma">${esc(art.firma)}</span>
        <span class="art-data">${dataIt(art.data)}</span>
        ${meta ? `<span class="art-dot">·</span><span>${esc(meta)}</span>` : ''}
      </div>
      <div class="art-tags">${tags}</div>
    </header>
    ${(art.sezioni||[]).map(sezione).join('')}
    ${provenienza(art)}`;
  document.title = `${art.titolo} — Muretto Box Virtuale`;
}
boot();
</script>
</body>
</html>
