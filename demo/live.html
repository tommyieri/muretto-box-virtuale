<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live — Muretto Box Virtuale</title>
<meta name="description" content="Il weekend di gara in diretta: classifica in tempo reale e la prossima sessione.">
<link rel="canonical" href="https://murettobox.com/live.html">
<link rel="stylesheet" href="muro.css?v=090826a">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23FF1E3C%27/%3E%3Cpath d=%27M7 23V9h3.4L16 17l5.6-8H25v14h-3.5v-8.2L16.9 21h-1.8l-4.6-6.2V23z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E">
<style>
  .stato{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin:20px 0 24px; }
  .spia{ display:inline-flex; align-items:center; gap:9px; height:34px; padding:0 14px;
    border-radius:999px; background:rgba(255,255,255,.05); border:1px solid var(--bordo);
    color:var(--calmo); font:500 11px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase; }
  .spia.viva{ background:rgba(255,30,60,.14); border-color:rgba(255,30,60,.4); color:#ff8a9c; }

  .colonne{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:var(--gap); align-items:start; }
  @media (max-width:900px){ .colonne{ grid-template-columns:1fr; } }

  .prossima{ padding:clamp(20px,3vw,30px); }
  .prossima .gp{ font-size:clamp(28px,4.4vw,44px); text-transform:uppercase; margin:10px 0 6px; }
  .prossima .circ{ color:var(--calmo); }
  .conto{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:22px; max-width:430px; }
  .conto div{ padding:12px 8px; border-radius:11px; background:rgba(255,255,255,.045); text-align:center; }
  .conto b{ display:block; font:500 27px/1 var(--mono); letter-spacing:-.03em; }
  .conto span{ display:block; margin-top:6px; color:var(--fioco); font:500 9px/1 var(--mono); letter-spacing:.14em; }
  .sessioni{ margin-top:26px; }
  .ses{ display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--bordo); }
  .ses b{ min-width:120px; font:700 15px/1 var(--disp); letter-spacing:.1em; text-transform:uppercase; }
  .ses span{ color:var(--calmo); font:500 12.5px/1 var(--mono); }
  .ses .etic{ margin-left:auto; }
  .ses.passata{ opacity:.4; }

  .torreLive{ border-radius:var(--r); background:var(--carbonio); border:1px solid var(--bordo); overflow:hidden; }
  .torreLive .cap{ display:flex; align-items:center; gap:9px; padding:12px 14px;
    border-bottom:1px solid var(--bordo); color:var(--fioco);
    font:500 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
  .torreLive .lista{ max-height:min(72vh,820px); overflow-y:auto; scrollbar-width:thin; }
  .fianco h3{ font-size:20px; text-transform:uppercase; margin-bottom:10px; }
  .fianco p{ color:var(--calmo); font-size:14.5px; }

  /* --------- il muretto in diretta --------- */
  .mesc{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin:12px 0; }
  .mesc button{ display:flex; align-items:center; justify-content:center; gap:7px; min-height:40px;
    border-radius:9px; background:rgba(255,255,255,.04); border:1px solid transparent;
    color:var(--calmo); font:500 11px/1 var(--mono); transition:background-color .15s,color .15s,border-color .15s; }
  .mesc button:hover{ background:rgba(255,255,255,.08); color:var(--testo); }
  .mesc button.on{ background:rgba(36,227,210,.12); border-color:rgba(36,227,210,.4); color:var(--ciano); }
  .esitoLive{ margin-top:14px; padding:14px; border-radius:11px; background:rgba(255,255,255,.04); }
  .esitoLive b.pos{ display:block; font:500 34px/1 var(--mono); color:var(--ciano); margin:6px 0 8px; }
  .onesta{ margin-top:12px; color:var(--fioco); font-size:12px; line-height:1.5; }
  .onesta b{ color:var(--calmo); }
  .sceltoLive{ display:flex; align-items:center; gap:9px; margin-bottom:4px; }
  .sceltoLive .bar{ width:4px; height:22px; border-radius:2px; background:var(--c,#8A93A3); }
  .sceltoLive b{ font:700 18px/1 var(--disp); letter-spacing:.09em; }
</style>
</head>
<body>
<header class="barra"></header>

<main class="scafo">
  <p class="occhiello">Diretta</p>
  <h1 class="titolone">Il muretto <em>in diretta</em></h1>

  <div class="stato">
    <span class="spia" id="spia"><span class="pallino"></span><span id="spiaTxt">collego…</span></span>
    <span class="etic" id="etichSess" hidden></span>
  </div>

  <div class="colonne">
    <div style="min-width:0">
      <!-- fuori sessione -->
      <section class="piastra prossima" id="prossima" hidden></section>
      <!-- in sessione -->
      <section class="torreLive" id="boxTorre" hidden>
        <div class="cap"><span>Classifica in tempo reale</span>
          <span style="margin-left:auto" id="notaTorre"></span></div>
        <div class="lista" id="torre"></div>
      </section>
    </div>
    <aside class="piastra piastra-p fianco" id="fianco"></aside>
  </div>
</main>

<footer class="piede"><div class="piede-in"></div></footer>

<script type="module">
import { guscio, dati, el, veri, V } from './muro.mjs?v=090826a';
import { WS_URL, HEARTBEAT_LIVE_S } from './live_config.mjs?v=090826a';
import { creaLiveClient } from './live_client.mjs?v=090826a';
import { creaTorreTiming } from './live_timing.mjs?v=250809a';
import { creaByLapLive } from './live_bylap.mjs?v=250809a';
import { rigiocaLive } from './ponte_live.mjs?v=040826a';

guscio('live.html');
const E = (id) => document.getElementById(id);

const NOMI = { fp1: 'Prove libere 1', fp2: 'Prove libere 2', fp3: 'Prove libere 3',
  sprint_quali: 'Qualifiche sprint', sprint: 'Sprint',
  qualifiche: 'Qualifiche', gara: 'Gara' };

let viva = false, montatoAttesa = false, ultimaGara = null;

/* ---- IL MURETTO IN DIRETTA ------------------------------------------------
   Stesso comando della pagina-gara, ma qui il futuro NON e' successo: niente
   soste vere dei rivali, niente Safety Car note. E' la proiezione del motore,
   e la differenza si scrive accanto al numero, sempre. */
const B = creaByLapLive();
let contestoLive = null, garaCorrente = null, scelto = null, mescolaScelta = 'MEDIUM';
let calendario = null, colori = {}, teams = {};
const SLICK = ['SOFT', 'MEDIUM', 'HARD'];

/* Una torre viva SEMPRE: e' lei l'unico giudice di «c'e' una sessione».
   Il collettore risponde anche quando dorme, e uno snapshot vuoto non e' una
   diretta: la pagina che scrive IN DIRETTA sopra una tabella vuota mente. */
const torre = creaTorreTiming({ lista: E('torre'), nota: E('notaTorre') });
torre.setAcceso(true);
const conRighe = () => E('torre').querySelectorAll('.tw-row').length > 0;

/* ------------------------------------------------------- fuori sessione */
function quandoIso(g, s) {
  const v = g.sessioni?.[s];
  return v ? new Date(`${v.data}T${v.ora_utc}:00Z`) : null;
}

async function mostraAttesa() {
  E('boxTorre').hidden = true;
  E('prossima').hidden = false;
  if (montatoAttesa) return;
  montatoAttesa = true;

  const [cal, man] = await Promise.all([
    dati(`data/calendario_2026.json?v=${V}`), dati(`data/manifest.json?v=${V}`)]);
  const gare = cal?.gare || [];
  const ora = new Date();
  const ORD = ['fp1', 'fp2', 'fp3', 'sprint_quali', 'sprint', 'qualifiche', 'gara'];

  let pross = null;
  for (const g of gare) {
    for (const s of ORD) {
      const q = quandoIso(g, s);
      if (q && q > ora && (!pross || q < pross.quando)) pross = { g, s, quando: q };
    }
    if (pross) break;
  }

  const box = E('prossima');
  if (!pross) {
    box.replaceChildren(el('p', { class: 'occhiello' }, 'Calendario'),
      el('h2', { class: 'gp' }, 'Stagione finita'),
      el('p', { class: 'circ' }, 'Il calendario 2026 è completo: si riparte il prossimo anno.'));
  } else {
    const g = pross.g;
    box.replaceChildren(
      el('p', { class: 'occhiello' }, `Round ${g.round} · prossimo appuntamento`),
      el('h2', { class: 'gp' }, g.titolo),
      el('p', { class: 'circ' }, `${g.circuito || ''} · ${g.giri} giri`),
      el('div', { class: 'conto', id: 'conto' }),
      el('div', { class: 'sessioni' },
        ORD.filter(s => g.sessioni?.[s]).map(s => {
          const q = quandoIso(g, s);
          return el('div', { class: 'ses' + (q < ora ? ' passata' : '') },
            el('b', {}, NOMI[s] || s),
            el('span', {}, q.toLocaleString('it-IT', { weekday: 'short', day: 'numeric',
              month: 'short', hour: '2-digit', minute: '2-digit' })),
            q.getTime() === pross.quando.getTime()
              ? el('span', { class: 'etic etic-r' }, 'prima') : null);
        })));
    conta(pross.quando);
  }

  const inDemo = new Set((man || []).map(r => r.gara));
  ultimaGara = gare.filter(x => x.gara_demo && inDemo.has(x.gara_demo)).pop() || null;
  fianco(false);
}

function conta(quando) {
  const box = E('conto');
  if (!box) return;
  const passo = () => {
    let d = Math.max(0, (quando - new Date()) / 1000);
    const gg = Math.floor(d / 86400); d -= gg * 86400;
    const hh = Math.floor(d / 3600); d -= hh * 3600;
    const mm = Math.floor(d / 60); const ss = Math.floor(d - mm * 60);
    box.replaceChildren(...[[gg, 'giorni'], [hh, 'ore'], [mm, 'minuti'], [ss, 'secondi']]
      .map(([v, t]) => el('div', {}, el('b', { class: 'n' }, String(v).padStart(2, '0')),
        el('span', {}, t))));
  };
  passo();
  setInterval(passo, 1000);
}

/** In diretta il fianco diventa il muretto: pilota, gomma, BOX ORA. */
function murettoLive() {
  const nome = scelto || '—';
  E('fianco').replaceChildren(...veri(
    el('h3', {}, 'Il muretto'),
    scelto
      ? el('div', { class: 'sceltoLive', stile: { '--c': colori[teams[scelto]] || '#8A93A3' } },
          el('span', { class: 'bar' }), el('b', {}, nome))
      : el('p', {}, 'Tocca un pilota nella classifica, scegli la gomma e premi BOX ORA.'),
    el('div', { class: 'mesc' }, SLICK.map(m => el('button', {
      class: mescolaScelta === m ? 'on' : '', type: 'button',
      onclick: () => { mescolaScelta = m; murettoLive(); } },
      el('span', { class: 'gomma ' + m }),
      m === 'SOFT' ? 'morbida' : m === 'MEDIUM' ? 'media' : 'dura'))),
    el('button', { class: 'btn btn-p', id: 'boxOra', type: 'button',
      stile: { width: '100%' }, disabled: !scelto, onclick: boxOra }, 'BOX ORA'),
    el('div', { id: 'esitoLive' }),
    el('p', { class: 'onesta' },
      'È una ', el('b', {}, 'proiezione'), ': il futuro non è ancora successo, quindi ',
      el('b', {}, 'i rivali non reagiscono'), ' e oltre ~6 giri non è validata.')));
}

function boxOra() {
  const L = B.giroPieno(), nLaps = B.nLaps();
  const box = E('esitoLive');
  if (!scelto || !L || !nLaps) {
    box.replaceChildren(el('div', { class: 'esitoLive' },
      'Il giro in corso non è ancora completo: riprova fra poco.'));
    return;
  }
  if (!contestoLive) {
    box.replaceChildren(el('div', { class: 'esitoLive' },
      'Il motore non è disponibile in questa pagina.'));
    return;
  }
  const giro = Math.min(nLaps - 1, L + 1);
  let esito;
  try {
    esito = rigiocaLive({ byLap: B.byLap(), nGiriGara: nLaps,
      nomeGara: garaCorrente, pilota: scelto, freezeLap: L, contestoLive,
      soste: [{ giro, mescola: mescolaScelta }] });
  } catch (err) {
    box.replaceChildren(el('div', { class: 'esitoLive' },
      `Il motore rifiuta questa sosta: ${err.message}`));
    return;
  }
  if (!esito.direttore?.approved) {
    const f = (esito.direttore?.violazioni ?? []).filter(v => v.severita === 'FATAL');
    box.replaceChildren(el('div', { class: 'esitoLive' },
      f[0]?.messaggio || 'Piano non valido: prova un\'altra gomma.'));
    return;
  }
  const i = esito.risultato?.ordine?.indexOf(scelto) ?? -1;
  box.replaceChildren(el('div', { class: 'esitoLive' },
    el('span', { class: 'st-occ', stile: { color: 'var(--fioco)', font: '500 10px/1 var(--mono)',
      letterSpacing: '.16em', textTransform: 'uppercase' } },
      `se ${scelto} si ferma al giro ${giro}`),
    el('b', { class: 'pos n' }, i < 0 ? '—' : 'P' + (i + 1)),
    el('span', { stile: { color: 'var(--calmo)', fontSize: '13.5px' } },
      'alla bandiera, con questa gomma.')));
}

function fianco(inDiretta) {
  if (inDiretta) { murettoLive(); return; }
  E('fianco').replaceChildren(...veri(
    el('h3', {}, inDiretta ? 'Il pannello strategia' : 'Nel frattempo'),
    el('p', {}, inDiretta
      ? 'Durante la gara la stessa domanda del muretto — «se mi fermo ora, dove rientro?» — si fa sulla pagina della gara, sui dati appena registrati.'
      : 'Non c\'è una sessione in corso. Puoi rigiocare l\'ultima gara e provare la strategia: è lo stesso pannello che vedrai qui in diretta.'),
    ultimaGara ? el('a', { class: 'btn btn-p', stile: { width: '100%', marginTop: '6px' },
      href: `gara.html?g=${encodeURIComponent(ultimaGara.gara_demo)}` },
      `Rivedi ${ultimaGara.nome}`) : null,
    el('a', { class: 'btn btn-s', stile: { width: '100%', marginTop: '8px' }, href: 'telemetria.html' },
      'Apri la telemetria')));
}

/* ------------------------------------------------------------ in diretta */
E('torre').addEventListener('click', (ev) => {
  const r = ev.target.closest('.tw-row[data-sigla]');
  if (!r) return;
  scelto = r.dataset.sigla;
  for (const x of E('torre').querySelectorAll('.tw-row')) x.classList.toggle('tw-sel', x === r);
  murettoLive();
});

function mostraDiretta(nome) {
  E('prossima').hidden = true;
  E('boxTorre').hidden = false;
  E('etichSess').hidden = !nome;
  if (nome) E('etichSess').textContent = nome;
  if (!viva) { viva = true; fianco(true); }
}

function spia(testo, accesa) {
  E('spiaTxt').textContent = testo;
  E('spia').classList.toggle('viva', !!accesa);
  E('spia').querySelector('.pallino').classList.toggle('on', !!accesa);
  const nav = document.getElementById('pallinoLive');
  if (nav) nav.classList.toggle('on', !!accesa);
}

let nomeSessione = null;
const client = creaLiveClient({
  url: WS_URL,
  onStato: (s) => { if (s !== 'connesso') spia(s === 'connessione' ? 'collego…' : 'riconnetto…', false); },
  onEvento: (e) => {
    try { torre.applica(e); } catch (_) { /* evento che la torre non consuma */ }
    try { B.applica(e); } catch (_) { /* evento che il lap-chart non consuma */ }
    if (e.session_name || e.session) nomeSessione = e.session_name || e.session;
    valuta();
  },
});

/** L'unico criterio: ci sono righe in torre? Allora e' una sessione. */
function valuta() {
  if (conRighe()) { spia('in diretta', true); mostraDiretta(nomeSessione); }
  else { viva = false; spia('nessuna sessione', false); mostraAttesa(); }
}

/* Il motore e l'identita' servono solo in diretta: si caricano una volta sola,
   e non fanno aspettare chi apre la pagina fuori sessione. */
(async () => {
  const [ctx, cal, t, c] = await Promise.all([
    dati(`vendor/simulatore/motore/contesto_live.json?v=${V}`),
    dati(`data/calendario_2026.json?v=${V}`),
    dati(`data/teams.json?v=${V}`),
    dati(`team_colori.json?v=${V}`),
  ]);
  contestoLive = ctx || null; calendario = cal; teams = t || {}; colori = c || {};
  // che GP si sta correndo: quello con una sessione oggi, altrimenti il piu' vicino
  const oggi = new Date().toISOString().slice(0, 10);
  const g = (cal?.gare || []).find(x => Object.values(x.sessioni || {})
    .some(v => v.data === oggi));
  garaCorrente = (g || (cal?.gare || []).slice(-1)[0])?.nome || null;
})();

// se entro pochi secondi non arriva niente, la sessione non c'e': meglio
// mostrare subito la prossima che lasciare una pagina che gira a vuoto.
setTimeout(valuta, 3000);

// il battito: se il flusso si ferma, si torna fuori-sessione da soli
setInterval(() => {
  if (viva && client.etaUltimoEvento() > HEARTBEAT_LIVE_S) {
    torre.setAcceso(false); torre.setAcceso(true);
    valuta();
  }
}, 5000);
</script>
</body>
</html>
