<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gara — Muretto Box Virtuale</title>
<meta name="description" content="Rivedi la gara giro per giro e decidi quando fermarsi ai box: il motore dice dove rientri.">
<link rel="stylesheet" href="muro.css?v=090826b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23FF1E3C%27/%3E%3Cpath d=%27M7 23V9h3.4L16 17l5.6-8H25v14h-3.5v-8.2L16.9 21h-1.8l-4.6-6.2V23z%27 fill=%27%23ffffff%27/%3E%3C/svg%3E">
<style>
  body{ overflow-y:scroll; }
  .scafo{ padding-bottom:0; max-width:1720px; }

  /* ------------------------------------------------------------ testata */
  .testa{ display:flex; align-items:flex-end; gap:18px; flex-wrap:wrap; margin-bottom:18px; }
  .testa .indietro{ display:inline-flex; align-items:center; gap:7px; color:var(--fioco);
    font:500 11px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; margin-bottom:9px; }
  .testa .indietro:hover{ color:var(--testo); }
  .testa h1{ font-size:clamp(28px,4vw,44px); text-transform:uppercase; }
  .testa .meta{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding-bottom:5px; }

  /* -------------------------------------------------------------- tavolo */
  .tavolo{ display:grid; grid-template-columns:290px minmax(0,1fr) 372px; gap:14px; align-items:start; }
  @media (max-width:1240px){ .tavolo{ grid-template-columns:250px minmax(0,1fr); } .rail{ grid-column:1/-1; } }
  @media (max-width:860px){ .tavolo{ grid-template-columns:1fr; } }

  /* ---------- torre ---------- */
  .torre{ border-radius:var(--r); background:var(--carbonio); border:1px solid var(--bordo);
    overflow:hidden; }
  .torre-t{ display:flex; align-items:center; gap:8px; padding:11px 14px;
    border-bottom:1px solid var(--bordo); color:var(--fioco);
    font:500 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
  /* FLEX, non blocco: la scena BOX ORA riordina le righe con `order`, e su un
     contenitore a blocco `order` e' semplicemente ignorato — le posizioni
     cambiavano e le righe restavano ferme. */
  .torre-c{ display:flex; flex-direction:column;
    max-height:min(66vh,720px); overflow-y:auto; scrollbar-width:thin; }
  .torre-c::-webkit-scrollbar{ width:6px; } .torre-c::-webkit-scrollbar-thumb{ background:var(--bordo-2); border-radius:3px; }
  .rw{ display:grid; grid-template-columns:26px 4px 1fr auto; align-items:center; gap:9px;
    width:100%; padding:8px 12px 8px 9px; text-align:left; border-bottom:1px solid rgba(255,255,255,.04);
    cursor:pointer; transition:background-color .14s var(--ease); min-height:46px; }
  .rw:hover{ background:rgba(255,255,255,.05); }
  .rw.scelto{ background:rgba(36,227,210,.09); }
  .rw.scelto .sig{ color:#fff; }
  .rw .pz{ font:500 12px/1 var(--mono); color:var(--fioco); text-align:right; }
  .rw .bar{ width:4px; height:26px; border-radius:2px; background:var(--c,#8A93A3); }
  .rw .sig{ font:700 16px/1 var(--disp); letter-spacing:.09em; }
  .rw .sotto{ display:flex; align-items:center; gap:6px; margin-top:3px; }
  .rw .sotto .gomma{ width:12px; height:12px; border-width:2px; }
  .rw .eta{ font:400 10px/1 var(--mono); color:var(--fioco); }
  .rw .gap{ font:500 12px/1 var(--mono); color:var(--calmo); text-align:right; white-space:nowrap; }
  .rw .gap.lead{ color:var(--ciano); }
  .rw .gap.lapped{ color:var(--fioco); }
  .rw.fuori{ opacity:.44; }
  .rw .st{ display:block; font:500 9px/1 var(--mono); letter-spacing:.12em; margin-top:4px; }
  .rw .st.box{ color:var(--verde); } .rw .st.rit{ color:var(--fioco); }

  /* ---------- arena ---------- */
  .arena{ position:relative; border-radius:var(--r); border:1px solid var(--bordo);
    background:radial-gradient(120% 100% at 50% 0%,#12161E,#090B0F 72%); overflow:hidden; }
  .arena canvas{ width:100%; height:clamp(340px,54vh,620px); display:block; }
  .arena .bandiera{ position:absolute; left:14px; top:14px; display:flex; align-items:center;
    gap:9px; padding:8px 13px; border-radius:9px; font:700 13px/1 var(--disp);
    letter-spacing:.13em; text-transform:uppercase; opacity:0; transform:translateY(-6px);
    transition:opacity .25s var(--ease), transform .25s var(--ease); pointer-events:none; }
  .arena .bandiera.on{ opacity:1; transform:none; }
  .arena .bandiera.SC{ background:rgba(255,176,0,.16); color:var(--ambra); box-shadow:inset 0 0 0 1px rgba(255,176,0,.4); }
  .arena .bandiera.VSC{ background:rgba(224,180,0,.13); color:#E0B400; box-shadow:inset 0 0 0 1px rgba(224,180,0,.35); }
  .arena .bandiera.RF{ background:rgba(255,30,60,.18); color:#FF6178; box-shadow:inset 0 0 0 1px rgba(255,30,60,.45); }
  .arena .giro{ position:absolute; right:16px; top:13px; text-align:right; }
  .arena .giro b{ font:500 30px/1 var(--mono); letter-spacing:-.04em; }
  .arena .giro span{ display:block; color:var(--fioco); font:500 9px/1 var(--mono); letter-spacing:.2em; margin-top:5px; }

  /* ---------- comandi ---------- */
  .comandi{ display:flex; align-items:center; gap:12px; padding:11px 14px; margin-top:12px;
    border-radius:var(--r); background:var(--carbonio); border:1px solid var(--bordo); }
  .via{ width:46px; height:46px; border-radius:12px; background:var(--rosso); color:#fff;
    display:grid; place-items:center; flex:0 0 auto; box-shadow:0 5px 16px -6px rgba(255,30,60,.7);
    transition:background-color .16s var(--ease); }
  .via:hover{ background:#ff3550; }
  .via svg{ width:19px; height:19px; }
  .vel{ display:flex; gap:2px; background:rgba(255,255,255,.045); border-radius:9px; padding:3px; flex:0 0 auto; }
  .vel button{ min-width:38px; height:32px; border-radius:7px; color:var(--fioco);
    font:500 12px/1 var(--mono); transition:background-color .15s, color .15s; }
  .vel button:hover{ color:var(--testo); }
  .vel button.on{ background:var(--testo); color:var(--nero); }

  .barra-t{ position:relative; flex:1 1 auto; height:34px; cursor:pointer; touch-action:none; }
  .barra-t .letto{ position:absolute; left:0; right:0; top:13px; height:8px; border-radius:4px;
    background:rgba(255,255,255,.07); overflow:hidden; }
  .barra-t .fatto{ position:absolute; left:0; top:0; bottom:0; background:var(--rosso); opacity:.75; }
  .barra-t .bd{ position:absolute; top:0; bottom:0; }
  .barra-t .bd.sc{ background:rgba(255,176,0,.55); }
  .barra-t .bd.vsc{ background:repeating-linear-gradient(90deg,rgba(224,180,0,.6) 0 4px,transparent 4px 8px); }
  .barra-t .bd.rf{ background:rgba(255,30,60,.8); }
  .barra-t .pit{ position:absolute; top:5px; width:2px; height:8px; border-radius:1px;
    background:var(--verde); transform:translateX(-1px); }
  .barra-t .cur{ position:absolute; top:6px; width:3px; height:22px; border-radius:2px;
    background:#fff; box-shadow:0 0 10px rgba(255,255,255,.55); transform:translateX(-1.5px); }
  .conta-giri{ font:500 13px/1 var(--mono); color:var(--calmo); white-space:nowrap; flex:0 0 auto; }
  .conta-giri b{ color:var(--testo); font-size:17px; }
  @media (max-width:720px){ .comandi{ flex-wrap:wrap; } .barra-t{ order:5; flex-basis:100%; } }

  /* ---------- rail strategia ---------- */
  .rail{ position:sticky; top:calc(var(--barra) + 12px); border-radius:var(--r);
    background:linear-gradient(180deg,#171B24,#0E1116); border:1px solid var(--bordo-2);
    overflow:hidden; }
  .rail::before{ content:""; position:absolute; inset:0 0 auto; height:2px;
    background:linear-gradient(90deg,var(--rosso),rgba(255,30,60,0)); }
  .rail-t{ display:flex; align-items:center; gap:10px; padding:13px 16px; border-bottom:1px solid var(--bordo); }
  .rail-t h2{ font-size:17px; letter-spacing:.16em; text-transform:uppercase; }
  .rail-t .chi{ margin-left:auto; display:flex; align-items:center; gap:8px; }
  .rail-t .chi .bar{ width:4px; height:22px; border-radius:2px; background:var(--c,#8A93A3); }
  .rail-t .chi b{ font:700 18px/1 var(--disp); letter-spacing:.1em; }
  .rail-c{ padding:16px; max-height:min(74vh,860px); overflow-y:auto; scrollbar-width:thin; }
  .rail-c::-webkit-scrollbar{ width:6px; } .rail-c::-webkit-scrollbar-thumb{ background:var(--bordo-2); border-radius:3px; }

  .st-verdetto{ padding:2px 0 14px; }
  .st-occ{ display:block; color:var(--fioco); font:500 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
  .st-riga{ display:flex; align-items:baseline; gap:14px; margin-top:9px; }
  .st-pos{ font:500 clamp(46px,7vw,60px)/.86 var(--mono); letter-spacing:-.05em; color:var(--ciano); }
  .st-di{ display:flex; flex-direction:column; gap:5px; }
  .st-di span{ color:var(--calmo); font-size:13.5px; }
  .st-banda{ color:var(--fioco) !important; font-size:12.5px !important; }
  .st-sub{ margin:9px 0 0; color:var(--fioco); font-size:13px; }
  .st-muto{ padding:22px 4px; color:var(--fioco); font-size:14px; }

  .st-vicini{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
  .st-vic{ padding:10px 12px; border-radius:10px; background:rgba(255,255,255,.04); }
  .st-vic span{ display:block; color:var(--fioco); font:500 9px/1 var(--mono); letter-spacing:.16em; text-transform:uppercase; }
  .st-vic b{ display:block; margin-top:7px; font:700 19px/1 var(--disp); letter-spacing:.08em; }
  .st-vic b.nulla{ color:var(--fioco); font-size:15px; }
  .st-vic i{ display:block; margin-top:4px; font-style:normal; font-size:12px; color:var(--calmo); }

  .st-blocco{ padding-top:15px; margin-top:15px; border-top:1px solid var(--bordo); }
  .st-blocco h4{ font-size:13px; letter-spacing:.18em; text-transform:uppercase; color:var(--calmo); margin-bottom:11px; }
  .curva{ width:100%; height:auto; display:block; }
  .st-nota{ margin:9px 0 0; color:var(--fioco); font-size:12.5px; line-height:1.5; }
  .st-nota b{ color:var(--calmo); }

  .st-soste{ display:grid; grid-template-columns:repeat(auto-fit,minmax(68px,1fr)); gap:6px; }
  .st-sosta{ padding:9px 6px; border-radius:9px; background:rgba(255,255,255,.04); text-align:center; }
  .st-sosta b{ display:block; font:500 19px/1 var(--mono); }
  .st-sosta span{ display:block; margin-top:5px; color:var(--fioco); font-size:10px; line-height:1.25; }
  .st-sosta.meglio{ background:rgba(47,213,118,.12); box-shadow:inset 0 0 0 1px rgba(47,213,118,.3); }
  .st-sosta.meglio b{ color:var(--verde); }

  .st-piedi{ display:flex; gap:16px; flex-wrap:wrap; padding-top:14px; margin-top:15px;
    border-top:1px solid var(--bordo); color:var(--fioco); font-size:12px; }
  .st-piedi b{ color:var(--calmo); }
  .st-neutra{ flex-basis:100%; color:var(--ambra); }

  /* Che cosa e' la gara rigiocata: sempre in pagina, non dietro un tooltip. */
  .ese-onesta{ padding:11px 16px; border-top:1px solid var(--bordo);
    color:var(--fioco); font-size:12px; line-height:1.5; }
  .ese-onesta b{ color:var(--calmo); }

  .st-mescbox{ margin-bottom:16px; }
  .st-mescbox .st-occ{ margin-bottom:8px; }
  .st-mesc{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .st-m{ display:flex; align-items:center; justify-content:center; gap:7px; min-height:40px;
    border-radius:9px; background:rgba(255,255,255,.04); border:1px solid transparent;
    color:var(--calmo); font:500 11px/1 var(--mono); letter-spacing:.06em;
    transition:background-color .15s, color .15s, border-color .15s; }
  .st-m:hover{ background:rgba(255,255,255,.08); color:var(--testo); }
  .st-m.on{ background:rgba(36,227,210,.12); border-color:rgba(36,227,210,.4); color:var(--ciano); }

  .rail-f{ padding:13px 16px; border-top:1px solid var(--bordo); display:flex; gap:9px; }
  .rail-f .btn{ flex:1 1 auto; min-height:44px; }

  /* ---------- esito della simulazione ---------- */
  .esito{ margin-top:14px; }
  .esito-g{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .esito-b{ padding:14px; border-radius:11px; background:rgba(255,255,255,.04); }
  .esito-b small{ display:block; color:var(--fioco); font:500 9px/1.3 var(--mono); letter-spacing:.14em; text-transform:uppercase; }
  .esito-b b{ display:block; margin-top:9px; font:500 30px/1 var(--mono); letter-spacing:-.04em; }
  .esito-b.tua{ background:rgba(255,30,60,.12); box-shadow:inset 0 0 0 1px rgba(255,30,60,.3); }
  .esito-b.tua b{ color:var(--rosso); }

  /* ---------- mobile: schede ---------- */
  .schede{ display:none; gap:6px; margin:12px 0; }
  @media (max-width:860px){
    .schede{ display:flex; }
    .tavolo{ gap:0; }
    .arena{ order:1; } .comandi{ order:2; } .rail{ order:3; margin-top:14px; position:static; }
    .torre{ order:4; margin-top:14px; }
    .rail[hidden], .torre[hidden]{ display:none; }
    .rail-c{ max-height:none; }
  }
</style>
</head>
<body>
<header class="barra"></header>

<main class="scafo">
  <div class="testa">
    <div>
      <a class="indietro" href="stagione.html">← Stagione 2026</a>
      <h1 id="tGp">—</h1>
    </div>
    <div class="meta" id="tMeta"></div>
  </div>

  <div class="schede" role="tablist">
    <button class="pil on" id="sbStrat" role="tab" aria-selected="true">Strategia</button>
    <button class="pil" id="sbTorre" role="tab" aria-selected="false">Classifica</button>
  </div>

  <div class="tavolo">
    <!-- classifica -->
    <section class="torre" aria-label="Classifica">
      <div class="torre-t"><span>Classifica</span><span style="margin-left:auto" id="torreGiro"></span></div>
      <div class="torre-c" id="torre"></div>
    </section>

    <!-- pista + comandi -->
    <div style="min-width:0">
      <div class="arena" id="arena">
        <canvas id="tela" aria-label="Mappa del circuito con la posizione delle vetture"></canvas>
        <div class="bandiera" id="bandiera"></div>
        <div class="giro"><b class="n" id="giroOra">1</b><span id="giroTot">/ —</span></div>
      </div>
      <div class="comandi">
        <button class="via" id="via" aria-label="Play"></button>
        <div class="vel" id="vel">
          <button data-s="1" class="on">1×</button><button data-s="2">2×</button>
          <button data-s="4">4×</button><button data-s="8">8×</button>
        </div>
        <div class="barra-t" id="scorri" role="slider" aria-label="Giro" tabindex="0"
             aria-valuemin="1" aria-valuenow="1">
          <div class="letto" id="letto"><div class="fatto" id="fatto"></div></div>
          <div class="cur" id="cur"></div>
        </div>
        <div class="conta-giri">GIRO <b class="n" id="lapNow">1</b>/<span class="n" id="lapMax">—</span></div>
      </div>
      <div class="esito" id="esito" role="status" aria-live="polite" hidden></div>
    </div>

    <!-- strategia: sempre aperta -->
    <aside class="rail" id="rail">
      <div class="rail-t">
        <h2>Strategia</h2>
        <div class="chi" id="railChi"></div>
      </div>
      <div class="rail-c" id="railC"></div>
      <div class="rail-f">
        <button class="btn btn-p" id="boxOra">BOX ORA</button>
        <button class="btn btn-s" id="reset" hidden aria-label="Torna al replay reale">↺</button>
      </div>
      <p class="ese-onesta">Con <b>BOX ORA</b> la gara riparte da qui con la tua sosta, fino alla
        bandiera. I rivali fanno le soste che hanno fatto davvero: è
        <b>informazione dal futuro</b>, quindi un ricalcolo su una gara già corsa e
        <b>non una previsione</b>.</p>
    </aside>
  </div>
</main>

<footer class="piede"><div class="piede-in"></div></footer>

<script type="module">
import { guscio, dati, datiObbligatori, el, veri, V, param, scriviParam, identita, coloreDi,
         nnum, guasto, scheletro, MESCOLA_IT } from './muro.mjs?v=090826b';
import { creaMappa } from './mappa.mjs?v=090826b';
import { pannello as pannelloStrategia, selettoreMescole } from './strategia.mjs?v=090826b';
import { makeClock, computeDurations, bands, fase } from './timeline.mjs?v=220726a';
import { creaAncora, giroDi as giroDiCum } from './orologio.mjs?v=250808a';
import { classifica, battistradaAiGiri, ordineArrivo } from './classifica.mjs?v=090826b';
import { creaReplayVero } from './replay_vero.mjs?v=250808a';
import { rispostaLive } from './ponte_live.mjs?v=040826a';

guscio('gara.html');

const E = (id) => document.getElementById(id);
let race = null, gara = null, colori = {}, schede = null, calendario = null;
let leadCum = {}, cumPil = {}, teamDi = {}, ancora = null, durate = {}, finestre = null;
let mappa = null, replay = null, indiceVista = null, vistaCart = null;
const vistaPil = {};
let selDrv = null, curP = 1, ctxLive = null, mescolaScelta = null;
let esitiGara = {}, nonPart = new Set(), pitLaps = {}, ultimoGiro = {}, griglia = [];
let arrivo = {};      // sigla -> {posizione, giri} — l'ordine d'arrivo, calcolato una volta
let scenaGp = null, STRAT = null, ESE = null;
let ultimaRisposta = null;
const SLICK = ['SOFT', 'MEDIUM', 'HARD'];
/** La gomma che BOX ORA monta.
 *  Mai null — il motore rifiuta un piano senza mescola (E05), e un rifiuto per un
 *  campo che l'utente non ha mai visto e' un vicolo cieco.
 *  E mai UGUALE a quella gia' montata, se l'utente non l'ha scelta lui: una gara
 *  asciutta finita su una sola mescola slick e' squalifica (REG01), quindi il
 *  Director respingeva ogni sosta proposta a inizio gara. Il muretto vero, alla
 *  prima sosta, cambia mescola: qui si fa lo stesso. */
function gommaPerBox() {
  if (SLICK.includes(mescolaScelta)) return mescolaScelta;      // scelta esplicita: si rispetta
  const su = [ultimaRisposta?.mescola_scelta,
              race?.byLap[Math.max(1, Math.floor(curP) - 1)]?.[selDrv]?.compound]
    .find(m => SLICK.includes(m));
  if (!su) return 'MEDIUM';
  return su === 'HARD' ? 'MEDIUM' : 'HARD';
}

const clock = makeClock({ onTick: (p) => frame(p), onEnd: () => icona(false) });

/* =================================================================== boot */
async function boot() {
  const man = await datiObbligatori(`data/manifest.json?v=${V}`);
  const nomi = man.map(r => r.gara);
  gara = nomi.includes(param('g')) ? param('g') : nomi[nomi.length - 1];
  scriviParam({ g: gara });

  const id = await identita(); colori = id.colori; schede = id.schede;
  const [r, cal, neutral, esiti, grids, vm] = await Promise.all([
    datiObbligatori(`data/${encodeURIComponent(gara)}.json?v=${V}`),
    dati(`data/calendario_2026.json?v=${V}`),
    dati(`neutralizzazione.json?v=${V}`),
    dati(`data/esiti.json?v=${V}`),
    dati(`data/grids.json?v=${V}`),
    dati(`data/vista/manifest.json?v=${V}`),
  ]);
  race = r; race.byLap = {};
  for (const lp of race.laps) race.byLap[lp.lap] = lp.cars;
  calendario = cal; finestre = neutral?.[gara] || null;
  esitiGara = esiti?.[gara] || {};
  nonPart = new Set(Object.entries(esitiGara).filter(([, t]) => t === 'NP').map(([d]) => d));
  vistaCart = vm?.cartella_di?.[gara] || null;
  griglia = grids?.[gara] || [];

  // tabelle di tempo
  leadCum = {}; cumPil = {}; teamDi = {}; ultimoGiro = {}; pitLaps = {};
  for (const lp of race.laps) for (const [d, c] of Object.entries(lp.cars)) {
    teamDi[d] = c.team; ultimoGiro[d] = lp.lap;
    if (c.in_lap) (pitLaps[d] ||= []).push(lp.lap);
    if (typeof c.cum_time === 'number' && !nonPart.has(d)) {
      (cumPil[d] ||= []).push({ lap: lp.lap, cum: c.cum_time });
      if (leadCum[lp.lap] === undefined || c.cum_time < leadCum[lp.lap]) leadCum[lp.lap] = c.cum_time;
    }
  }
  for (const d in cumPil) cumPil[d].sort((a, b) => a.lap - b.lap);
  const rf = new Set();
  for (const [a, b] of (finestre?.rf || [])) for (let L = a; L <= b; L++) rf.add(L);
  durate = computeDurations(race.byLap, race.n_laps, rf);
  leadCum[0] = (leadCum[1] !== undefined) ? leadCum[1] - durate[1] : 0;
  ancora = creaAncora({ lead: leadCum, minLap: 1, maxLap: race.n_laps });
  arrivo = {};
  for (const a of ordineArrivo(k => race.byLap[k], race.n_laps, d => nonPart.has(d))) arrivo[a.drv] = a;

  testata();
  E('lapMax').textContent = race.n_laps;
  E('giroTot').textContent = '/ ' + race.n_laps;
  E('scorri').setAttribute('aria-valuemax', race.n_laps);
  disegnaBande();
  costruisciTorre();

  await Promise.all([apriMappa(), apriVista()]);
  clock.setDur(L => durate[L]);
  clock.reset(race.n_laps + 1);
  scegli(ordineAl(1)[0]?.drv || Object.keys(cumPil)[0]);
  frame(1);
}

function testata() {
  const c = calendario?.gare?.find(g => g.gara_demo === gara);
  E('tGp').textContent = c?.titolo || gara;
  document.title = `${c?.titolo || gara} — Muretto Box Virtuale`;
  const bagnata = race.laps.some(lp => Object.values(lp.cars)
    .some(x => x.compound === 'INTERMEDIATE' || x.compound === 'WET'));
  E('tMeta').replaceChildren(
    c ? el('span', { class: 'etic' }, new Date(c.data + 'T12:00:00')
      .toLocaleDateString('it-IT', { day: 'numeric', month: 'long' })) : null,
    el('span', { class: 'etic' }, `${race.n_laps} giri`),
    el('span', { class: 'etic' }, bagnata ? 'pista bagnata' : 'pista asciutta'),
    el('span', { class: 'etic etic-c' }, `${Object.keys(cumPil).length} in gara`));
}

/* ================================================================= mappa */
async function apriMappa() {
  try {
    replay = await creaReplayVero({ url: `data/replay_${encodeURIComponent(gara)}.json?v=${V}` });
  } catch (e) { replay = null; }
  try {
    mappa = await creaMappa({
      canvas: E('tela'),
      url: `data/pista_${encodeURIComponent(gara)}.json?v=${V}`,
      pitlane: replay?.pitlane || null,
    });
  } catch (e) { mappa = null; }
  E('tela').addEventListener('click', (ev) => {
    if (!mappa) return;
    const r = E('tela').getBoundingClientRect();
    const s = mappa.colpito(ev.clientX - r.left, ev.clientY - r.top);
    if (s) scegli(s);
  });
}

/* ---- dove sta ogni pilota all'istante p (giro frazionario del battistrada) ---- */
function posizioni(p) {
  const T = ancora?.tempoDa(p);
  if (T === undefined) return [];
  const out = [];
  if (replay) {
    for (const d of Object.keys(cumPil)) {
      const q = replay.posizioneDi(d, T);
      if (!q) continue;
      out.push({ sigla: d, f: q.f, box: q.box, colore: coloreDi(teamDi[d], colori),
                 dim: !!selDrv && d !== selDrv && !!scenaGp });
    }
    if (out.length) return out;
  }
  // ricostruzione dai tempi-giro dove il GPS non c'e' (pallino vuoto: e' una stima)
  for (const d of Object.keys(cumPil)) {
    const g = giroDiCum(cumPil[d], T, { tempoZero: leadCum[0], lapZero: 0 });
    if (!g) continue;
    const c = race.byLap[g.lap]?.[d];
    out.push({ sigla: d, f: g.fd, stimato: true,
               box: c?.in_lap ? 'in' : (c?.out_lap ? 'out' : null),
               colore: coloreDi(teamDi[d], colori) });
  }
  return out;
}

/* ============================================================= classifica */
function ordineAl(p) {
  const L = Math.max(1, Math.min(race.n_laps, Math.floor(p)));
  const f = Math.min(1, Math.max(0, p - L));
  const bs = battistradaAiGiri(k => race.byLap[k], L, race.n_laps, d => !nonPart.has(d));
  return classifica({
    cumCorrente: race.byLap[L], cumPrecedente: race.byLap[L - 1],
    ancora: leadCum[0], primoGiro: L === 1, f, L, nLap: race.n_laps,
    battistrada: bs, escludi: d => nonPart.has(d), ordineGriglia: griglia,
  });
}

const righe = {};
function costruisciTorre() {
  const box = E('torre'); box.replaceChildren();
  // ANCHE CHI NON E' PARTITO. Prima la torre nasceva dai soli piloti con un cum_time,
  // quindi un non partente non compariva da nessuna parte — ne' in classifica ne' fra i
  // fuori. La griglia non si svuota mai: all'ultimo giro ci sono tutti, ognuno col suo
  // stato (in pista, arrivato, doppiato, ritirato, non partito).
  const tutti = [...new Set([...Object.keys(cumPil), ...[...nonPart].filter(d => teamDi[d])])];
  for (const d of tutti) {
    const n = el('button', { class: 'rw', type: 'button', 'data-d': d,
      stile: { '--c': coloreDi(teamDi[d], colori) },
      onclick: () => scegli(d) },
      el('span', { class: 'pz n' }, ''),
      el('span', { class: 'bar' }),
      el('span', {},
        el('span', { class: 'sig' }, d),
        el('span', { class: 'sotto' })),
      el('span', { class: 'gap n' }, ''));
    box.append(n);
    righe[d] = { root: n, pz: n.children[0], sig: n.children[2].children[0],
                 sotto: n.children[2].children[1], gap: n.children[3] };
  }
}

function pittaTorre(p) {
  const L = Math.max(1, Math.min(race.n_laps, Math.floor(p)));
  const ord = ordineAl(p);
  const box = E('torre');
  const visti = new Set();
  ord.forEach((r, i) => {
    const R = righe[r.drv]; if (!R) return;
    visti.add(r.drv);
    const c = race.byLap[L]?.[r.drv];
    R.pz.textContent = r.pos;
    R.gap.textContent = r.et;
    R.gap.className = 'gap n ' + (r.cls || '');
    R.sotto.replaceChildren(...veri(
      c?.compound ? el('span', { class: 'gomma ' + c.compound, title: c.compound }) : null,
      c?.tyre_age != null ? el('span', { class: 'eta' }, `${c.tyre_age}g`) : null,
      c?.in_lap ? el('span', { class: 'st box' }, 'BOX') : null,
      c?.out_lap ? el('span', { class: 'st box' }, 'OUT') : null));
    R.root.classList.remove('fuori');
    if (R.root.style.order !== String(i)) R.root.style.order = i;
    box.append(R.root);
  });
  // CHI NON HA UNA RIGA AL GIRO DEL BATTISTRADA. Sparisce da byLap[L] chi ha completato
  // MENO di L giri, e sono tre cose diverse: chi non e' partito, chi si e' ritirato, e chi
  // e' ARRIVATO ma doppiato — la sua ultima riga e' il giro 69 di una gara da 70.
  // Prima erano tutti «ritirato»: all'Hungaroring dodici piloti che avevano finito la gara,
  // dieci in Australia, e non solo alla bandiera. Lo stato lo dice esiti.json, che e' la
  // classificazione d'arrivo del progetto; il posto in fondo lo da' l'ordine d'arrivo.
  const fuori = [];
  for (const d of Object.keys(righe)) {
    if (!visti.has(d)) fuori.push(d);
  }
  fuori.sort((a, b) => (arrivo[a]?.posizione ?? 99) - (arrivo[b]?.posizione ?? 99));
  fuori.forEach((d, i) => {
    const R = righe[d];
    const t = esitiGara[d];
    const suo = ultimoGiro[d] ?? 0;
    const indietro = Math.max(0, L - suo);
    R.root.classList.add('fuori');
    R.sotto.replaceChildren();
    R.root.style.order = 90 + i;
    if (t === 'NP') {
      R.pz.textContent = ''; R.gap.textContent = 'non parte';
    } else if (t === 'RIT') {
      R.pz.textContent = ''; R.gap.textContent = 'ritirato';
    } else {
      // ancora in gara, solo piu' indietro nel conteggio giri: non e' «fuori».
      // LA PAROLA LA DECIDE esiti.json, non il conteggio delle righe. Alla bandiera
      // in Australia sette piloti hanno l'ultima riga al giro 57 su 58 ma la
      // classificazione li mette a PIENO GIRO: scrivere «+1 giro» contraddirebbe il
      // nostro stesso dato. Il numero di giri si mostra solo a chi e' doppiato davvero.
      R.root.classList.remove('fuori');
      R.pz.textContent = arrivo[d]?.posizione ?? '';
      R.gap.textContent = (t === 'doppiato' && indietro > 0)
        ? `+${indietro} gir${indietro > 1 ? 'i' : 'o'}`
        : (L >= race.n_laps ? 'arrivato' : '—');
    }
    R.gap.className = 'gap n lapped';
    box.append(R.root);
  });
  E('torreGiro').textContent = `giro ${L}`;
}

/* ================================================================ frame */
function frame(p) {
  curP = p;
  const L = Math.max(1, Math.min(race.n_laps, Math.floor(p)));
  E('giroOra').textContent = L;
  E('lapNow').textContent = L;
  const pct = Math.max(0, Math.min(100, (p - 1) / race.n_laps * 100));
  E('fatto').style.width = pct + '%';
  E('cur').style.left = pct + '%';
  E('scorri').setAttribute('aria-valuenow', L);

  const fs = fase(finestre, L);
  const b = E('bandiera');
  b.className = 'bandiera' + (fs ? ' on ' + fs : '');
  b.textContent = fs === 'SC' ? 'Safety car' : fs === 'VSC' ? 'Virtual safety car'
    : fs === 'RF' ? 'Bandiera rossa' : '';
  if (mappa) { mappa.setRegime(fs); if (!scenaGp) mappa.aggiorna(posizioni(p)); }

  pittaTorre(p);
  aggiornaTorreScelta();
  if (!scenaGp) aggiornaStrategia();
}

function icona(playing) {
  E('via').innerHTML = playing
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  E('via').setAttribute('aria-label', playing ? 'Pausa' : 'Play');
}

/* =============================================================== comandi */
E('via').addEventListener('click', () => {
  if (scenaGp) { scenaGp.playing ? scenaGp.stop() : scenaGp.play(); icona(!!scenaGp.playing); return; }
  clock.toggle(); icona(clock.playing);
});
E('vel').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  (scenaGp || clock).setSpeed(+b.dataset.s);
  [...E('vel').children].forEach(x => x.classList.toggle('on', x === b));
});
(function scorrevole() {
  const barra = E('scorri');
  let giu = false;
  const vai = (ev) => {
    if (scenaGp || !race) return;
    const r = barra.getBoundingClientRect();
    const x = (ev.clientX ?? ev.touches?.[0]?.clientX ?? NaN) - r.left;
    if (!isFinite(x) || !r.width) return;          // mai un orologio a NaN
    const p = 1 + Math.max(0, Math.min(1, x / r.width)) * race.n_laps;
    clock.pause(); icona(false); clock.seek(p);
  };
  barra.addEventListener('pointerdown', (e) => {
    giu = true;
    try { barra.setPointerCapture(e.pointerId); } catch (_) { /* puntatore gia' finito */ }
    vai(e);
  });
  barra.addEventListener('pointermove', (e) => { if (giu) vai(e); });
  barra.addEventListener('pointerup', () => { giu = false; });
  barra.addEventListener('keydown', (e) => {
    const d = { ArrowLeft: -1, ArrowRight: 1, PageDown: -5, PageUp: 5 }[e.key];
    // durante la scena l'orologio non e' questo: muoverlo scriveva sulla stessa
    // torre del fantasma e invertiva l'icona del play.
    if (!d || scenaGp || !race) return;
    e.preventDefault();
    clock.pause(); icona(false); clock.seek(Math.floor(curP) + d);
  });
})();

function disegnaBande() {
  const letto = E('letto');
  [...letto.querySelectorAll('.bd')].forEach(x => x.remove());
  for (const b of bands(finestre, race.n_laps)) {
    letto.append(el('div', { class: 'bd ' + b.type,
      stile: { left: b.left + '%', width: b.width + '%' } }));
  }
}
function disegnaPit(d) {
  const barra = E('scorri');
  [...barra.querySelectorAll('.pit')].forEach(x => x.remove());
  for (const L of (pitLaps[d] || [])) {
    barra.append(el('div', { class: 'pit', stile: { left: (L / race.n_laps * 100) + '%' } }));
  }
}

/* ============================================================ selezione */
function scegli(d) {
  if (!d || d === selDrv) return;
  selDrv = d; mescolaScelta = null;
  mappa?.setScelto(d);
  E('railChi').replaceChildren(
    el('span', { class: 'bar', stile: { background: coloreDi(teamDi[d], colori) } }),
    el('b', {}, d));
  disegnaPit(d);
  aggiornaTorreScelta();
  aggiornaStrategia();
}
function aggiornaTorreScelta() {
  for (const d in righe) righe[d].root.classList.toggle('scelto', d === selDrv);
}

/* ============================================================ strategia */
async function vistaDi(d) {
  if (!vistaCart) return null;
  if (vistaPil[d] !== undefined) return vistaPil[d];
  vistaPil[d] = await dati(`data/vista/${encodeURIComponent(vistaCart)}/${d}.json?v=${V}`);
  return vistaPil[d];
}
async function apriVista() {
  if (!vistaCart) return;
  indiceVista = await dati(`data/vista/${encodeURIComponent(vistaCart)}/indice.json?v=${V}`);
}
async function contesto() {
  if (ctxLive !== null) return ctxLive;
  ctxLive = await dati(`vendor/simulatore/motore/contesto_live.json?v=${V}`) || false;
  return ctxLive;
}

let ultimaChiave = '';
async function aggiornaStrategia() {
  const c = E('railC');
  if (!selDrv) return;
  if (!indiceVista) {
    c.replaceChildren(el('div', { class: 'st-muto' },
      'Per questa gara il motore non ha una risposta pronta.'));
    return;
  }
  // IL GIRO E' QUELLO DELLA BARRA, sempre. Prima veniva schiacciato dentro la
  // copertura della vista: al giro 1 il pannello rispondeva sul giro 5 e scriveva
  // «Se ti fermi al giro 6» mentre il contagiri diceva 1. Una risposta giusta per una
  // domanda che nessuno ha fatto e' peggio di nessuna risposta — e rendeva anche
  // irraggiungibile il ramo «Vai al giro N» scritto dodici righe piu' sotto.
  const L = Math.max(1, Math.floor(curP) - 1);
  const chiave = `${selDrv}|${L}|${mescolaScelta || ''}`;
  if (chiave === ultimaChiave) return;
  ultimaChiave = chiave;

  const v = await vistaDi(selDrv);
  if (chiave !== ultimaChiave) return;
  let s = v?.giri?.find(g => g.freeze_lap === L) || null;

  if (mescolaScelta && s) {
    const ctx = await contesto();
    if (chiave !== ultimaChiave) return;
    if (ctx) {
      const calc = rispostaLive({ byLap: race.byLap, nGiriGara: race.n_laps, nomeGara: gara,
        pilota: selDrv, freezeLap: L, contestoLive: ctx, mescolaScelta });
      if (calc && !calc.senza_risposta) s = calc;
    }
  }

  const frag = document.createDocumentFragment();
  const attuale = race.byLap[L]?.[selDrv]?.compound || null;
  frag.append(selettoreMescole({
    scelta: mescolaScelta, attuale,
    onScegli: (m) => { mescolaScelta = m; ultimaChiave = ''; aggiornaStrategia(); },
  }));
  if (!s || s.senza_risposta) {
    ultimaRisposta = null;
    // il giro da proporre dipende da DOVE sei: a inizio gara il primo utile in avanti,
    // a fine gara l'ultimo utile all'indietro. Proporre «vai al giro 10» quando manca
    // un giro alla bandiera e' un consiglio che nessuno seguirebbe.
    const utili = (v?.giri || []).filter(x => !x.senza_risposta && x.pannello);
    const primo = (L > indiceVista.ultimo_giro)
      ? utili[utili.length - 1]
      : (utili.find(x => x.freeze_lap >= L) || utili[0]);
    const presto = L < indiceVista.primo_giro;
    const tardi = L > indiceVista.ultimo_giro;
    // lo stesso giro che legge il contagiri: l'orologio arriva a n+1 (il traguardo),
    // e scrivere «giro 45 di 44» sarebbe un numero che in pagina non esiste.
    const g = Math.min(race.n_laps, Math.max(1, Math.floor(curP)));
    frag.append(el('div', { class: 'st-muto' },
      el('p', { stile: { margin: '0 0 12px' } },
        presto ? `Al giro ${g} la gara non è ancora leggibile: serve qualche giro di passo prima di poter rispondere.`
        : tardi ? `Al giro ${g} manca troppo poco alla bandiera perché fermarsi abbia una risposta.`
        : `A questo giro il motore non risponde per ${selDrv}.`),
      primo ? el('button', {
        class: 'btn btn-s', type: 'button',
        onclick: () => { clock.pause(); icona(false); clock.seek(primo.freeze_lap + 1); },
      }, `Vai al giro ${primo.freeze_lap + 1}`) : null));
    // il tasto non invita a premere quando non c'e' niente da chiedere: la strada
    // e' il bottone «Vai al giro N» qui sopra, non un errore dopo il click.
    if (!STRAT) {
      E('boxOra').disabled = true;
      E('boxOra').title = presto ? 'Il motore risponde da qualche giro più avanti'
                                 : 'Troppo tardi perché una sosta abbia una risposta';
    }
  } else {
    ultimaRisposta = s;
    if (!STRAT) { E('boxOra').disabled = false; E('boxOra').removeAttribute('title'); }
    frag.append(pannelloStrategia(s, {
      pilota: selDrv, giro: Math.floor(curP), nGiri: race.n_laps,
      onGiro: (g) => { clock.pause(); icona(false); clock.seek(g); },
    }));
  }
  c.replaceChildren(frag);
}

/* ============================================================== box ora */
async function caricaEse() {
  if (ESE) return ESE;
  const [mod, vista] = await Promise.all([
    import('./ese.mjs?v=080826b'), import('./ese_vista.mjs?v=080826b')]);
  const fetchJson = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(u); return r.json(); };
  ESE = { mod, vista, prep: await mod.preparaGara(gara, { fetchJson }) };
  return ESE;
}

E('boxOra').addEventListener('click', async () => {
  if (!selDrv) return;
  const b = E('boxOra'); b.disabled = true;
  try {
    await caricaEse();

    // IL CONGELAMENTO PRIMA, IL GIRO DOPO — e in quest'ordine, non nell'altro.
    // Prima il giro si calcolava da curP e poi si chiedeva il congelamento: a inizio
    // gara usciva giro=2 con freeze=5, cioe' una sosta PRIMA del congelamento, e il
    // motore la rifiutava giustamente. Il primo click che l'interfaccia offriva era
    // quello rotto, in tutte le gare, e in pagina finiva un JSON.stringify.
    let freeze = STRAT?.freeze ?? null;
    if (freeze === null) {
      const voluto = Math.max(2, Math.min(race.n_laps - 1, Math.floor(curP)));
      const f = ESE.mod.congelamentoPer({ nome: ESE.prep.nome, contesto: ESE.prep.contesto,
        pilota: selDrv, giroSosta: voluto });
      if (f.freezeLap === null) {
        nota(`Il motore non ha ancora un passo per ${selDrv}: prova qualche giro piu' avanti.`);
        return;
      }
      freeze = f.freezeLap;
    }
    // la sosta cade DOVE STAI GUARDANDO, ma mai prima del congelamento
    const giro = Math.max(freeze + 1,
      Math.min(race.n_laps - 1, Math.round(scenaGp?.posizione ?? Math.floor(curP))));

    const soste = [...(STRAT?.soste ?? []).filter(x => x.giro !== giro),
                   { giro, mescola: gommaPerBox() }].sort((a, b) => a.giro - b.giro);
    let esiti;
    try {
      esiti = ESE.vista.eseguiRigioca({ prep: ESE.prep, pilota: selDrv, freeze, soste });
    } catch (err) {
      // il messaggio del motore e' un referto interno (contiene JSON): resta in console.
      console.warn('BOX ORA rifiutato:', err.message);
      nota('Il motore non riesce a mettere in scena questa sosta: prova un altro giro o un\'altra gomma.');
      return;
    }
    if (!esiti.mio.direttore.approved) {
      const f = (esiti.mio.direttore.violazioni ?? []).filter(v => v.severita === 'FATAL');
      nota(f[0]?.messaggio || 'Piano non valido: prova un altro giro o un\'altra gomma.');
      return;
    }
    // STRAT si scrive SOLO quando il piano e' davvero valido: prima veniva assegnato
    // subito, e un rifiuto lasciava la pagina con un congelamento fantasma e il tasto
    // di azzeramento ancora nascosto.
    STRAT = { freeze, soste, esiti };
    E('reset').hidden = false;
    avviaScena(giro);
  } finally { b.disabled = false; }
});

function nota(testo) {
  E('esito').hidden = false;
  E('esito').replaceChildren(el('div', { class: 'piastra piastra-p' },
    el('p', { stile: { margin: 0, color: 'var(--calmo)', fontSize: '14px' } }, testo)));
}

async function avviaScena(giroSosta) {
  const { creaGhostPlay } = await import('./ghostplay.mjs?v=250724c');
  const { simDaRigioca } = await import('./fantasma_sim.mjs?v=080826b');
  const sim = simDaRigioca({ risultato: STRAT.esiti.mio.risultato, race,
    pilota: selDrv, freeze: STRAT.freeze });
  if (!sim) { nota('La scena non è disponibile per questa strategia.'); return; }
  sim.pitLap = giroSosta;
  if (scenaGp) scenaGp.stop();
  clock.pause();
  E('reset').hidden = false;
  E('esito').hidden = true;
  const mesc = soste0(giroSosta);
  nota(`${selDrv} si ferma al giro ${giroSosta}${mesc ? ' con gomma ' + (MESCOLA_IT[mesc] || mesc.toLowerCase()) : ''} — e la gara continua fino alla bandiera. Premi di nuovo BOX ORA per aggiungere un'altra sosta.`);

  scenaGp = creaGhostPlay({
    sim, pista: mappa, coloreDi: sg => coloreDi(teamDi[sg], colori),
    onTower: torreScena, giroRisposta: null,
    p0: Math.max(STRAT.freeze, giroSosta - 1), durataTot: 22,
    onFine: () => { icona(false); verdetto(); },
  });
  scenaGp.play(); icona(true);
}
function soste0(g) { return STRAT?.soste.find(x => x.giro === g)?.mescola || null; }

function torreScena(rs, meta) {
  const presenti = new Set(rs.map(r => r.drv));
  rs.forEach((r, i) => {
    const R = righe[r.drv]; if (!R) return;
    R.pz.textContent = r.pos;
    R.gap.textContent = r.gapTxt; R.gap.className = 'gap n ' + (r.gapCls || '');
    R.sotto.replaceChildren(...veri(r.inPit ? el('span', { class: 'st box' }, 'BOX') : null));
    R.root.style.order = i;
    R.root.classList.toggle('fuori', false);
  });
  for (const d in righe) righe[d].root.style.display = presenti.has(d) ? '' : 'none';
  E('giroOra').textContent = meta.lap; E('lapNow').textContent = meta.lap;
  E('torreGiro').textContent = `giro ${meta.lap}`;
  const pct = ((meta.p ?? meta.lap) - 1) / race.n_laps * 100;
  E('fatto').style.width = pct + '%'; E('cur').style.left = pct + '%';
}

function verdetto() {
  if (!STRAT?.esiti) return;
  const { mio, vero } = STRAT.esiti;
  const posDi = (run) => { const i = run?.risultato?.ordine?.indexOf(selDrv); return (i == null || i < 0) ? null : i + 1; };
  const reale = ESE.prep.arrivoReale.find(r => r.drv === selDrv)?.posizione ?? null;
  const P = (n) => n == null ? '—' : 'P' + n;
  E('esito').hidden = false;
  E('esito').replaceChildren(el('div', { class: 'piastra piastra-p' },
    el('h3', { stile: { fontSize: '20px', textTransform: 'uppercase', marginBottom: '14px' } },
      `${selDrv} — com'è finita`),
    el('div', { class: 'esito-g' },
      el('div', { class: 'esito-b' }, el('small', {}, 'nella gara vera'), el('b', { class: 'n' }, P(reale))),
      el('div', { class: 'esito-b' }, el('small', {}, 'strategia vera nel motore'), el('b', { class: 'n' }, P(posDi(vero)))),
      el('div', { class: 'esito-b tua' }, el('small', {}, 'la tua strategia'), el('b', { class: 'n' }, P(posDi(mio))))),
    el('p', { class: 'st-nota', stile: { marginTop: '12px' } },
      'Le prime due caselle dicono quanto il motore ci prende da solo. La differenza fra la seconda e la terza è la tua mossa.')));
}

E('reset').addEventListener('click', () => {
  if (scenaGp) { scenaGp.stop(); scenaGp = null; }
  STRAT = null; ultimaChiave = '';
  E('reset').hidden = true; E('esito').hidden = true;
  for (const d in righe) righe[d].root.style.display = '';
  mappa?.setSpento(false);
  icona(false);
  frame(clock.position);
  aggiornaStrategia();
});

/* ---------------------------------------------------------- schede mobile */
for (const [b, mostra] of [['sbStrat', 'rail'], ['sbTorre', 'torre']]) {
  E(b).addEventListener('click', () => {
    E('rail').hidden = mostra !== 'rail';
    E('torre').hidden = mostra !== 'torre';
    E('sbStrat').classList.toggle('on', mostra === 'rail');
    E('sbTorre').classList.toggle('on', mostra === 'torre');
    E('sbStrat').setAttribute('aria-selected', String(mostra === 'rail'));
    E('sbTorre').setAttribute('aria-selected', String(mostra === 'torre'));
  });
}
function adattaSchede() {
  const stretto = window.matchMedia('(max-width:860px)').matches;
  if (!stretto) { E('rail').hidden = false; E('torre').hidden = false; }
  else if (!E('rail').hidden && !E('torre').hidden) E('torre').hidden = true;
}
window.addEventListener('resize', adattaSchede);
adattaSchede();

icona(false);
scheletro(E('railC'), 4, 52);
// un boot che fallisce in silenzio si diagnostica solo a mano: il motivo va in console
boot().catch((e) => {
  console.error('gara: boot fallito —', e);
  guasto(E('railC'), () => location.reload());
});
</script>
</body>
</html>
