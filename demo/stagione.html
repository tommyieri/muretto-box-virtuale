<style>
  .griglia{ display:grid; grid-template-columns:repeat(auto-fill,minmax(272px,1fr)); gap:var(--gap); }

  .gp{
    position:relative; display:flex; flex-direction:column; min-height:196px;
    padding:18px; border-radius:var(--r);
    background:linear-gradient(180deg,var(--piastra),var(--carbonio));
    border:1px solid var(--bordo); overflow:hidden;
    transition:border-color .2s var(--ease), transform .2s var(--ease);
  }
  a.gp:hover{ border-color:var(--bordo-2); transform:translateY(-2px); }
  a.gp:hover .disegno{ opacity:.5; }
  .gp .disegno{
    position:absolute; right:-26px; top:-14px; width:170px; height:170px;
    opacity:.24; transition:opacity .25s var(--ease); pointer-events:none;
  }
  .gp .disegno path{ fill:none; stroke:#8FA0BC; stroke-width:11; stroke-linejoin:round; }
  .gp .capo{ display:flex; align-items:center; gap:9px; }
  .gp .rnd{ font:500 10px/1 var(--mono); letter-spacing:.18em; color:var(--fioco); }
  .gp h3{ margin:11px 0 0; font-size:25px; line-height:1.02; text-transform:uppercase; max-width:11ch; }
  .gp .circ{ margin-top:7px; color:var(--calmo); font-size:13.5px; }
  .gp .fondo{ margin-top:auto; padding-top:14px; display:flex; align-items:center; gap:9px; }
  .gp .fondo .livrea{ height:20px; margin-right:0; }
  .gp .chi{ font:700 15px/1 var(--disp); letter-spacing:.08em; }
  .gp .quando{ margin-left:auto; color:var(--fioco); font:500 11px/1 var(--mono); letter-spacing:.05em; }
  .gp.futura{ background:var(--carbonio); }
  .gp.futura h3, .gp.futura .circ{ opacity:.72; }
  .gp.prossima{ border-color:rgba(255,30,60,.45); }
  .gp.prossima::after{ content:""; position:absolute; inset:0; border-radius:var(--r);
    box-shadow:inset 0 0 0 1px rgba(255,30,60,.3); pointer-events:none; }

  .conta{ display:flex; flex-wrap:wrap; gap:26px; margin-bottom:6px; }
  .conta div b{ display:block; font:700 30px/1 var(--mono); letter-spacing:-.03em; }
  .conta div span{ color:var(--fioco); font:500 10px/1 var(--mono); letter-spacing:.18em; text-transform:uppercase; }
</style>

<body>
<header class="barra"></header>

<main class="scafo">
  <p class="occhiello" data-i18n="stagione.occhiello">Formula 1 · Calendar</p>
  <h1 class="titolone" data-i18n-html="stagione.titolo">2026 <em>Season</em></h1>
  <p class="sottotitolo" data-i18n="stagione.sottotitolo">Every Grand Prix already run can be replayed
     from start to finish, with the strategy in your hands. Tap a race to open it.</p>

  <div class="conta" id="conta" style="margin-top:26px"></div>

  <h2 class="sezione-t"><span data-i18n="stagione.gare_corse">Races run</span> <span class="coda" id="codaCorse"></span></h2>
  <div class="griglia" id="corse"></div>

  <h2 class="sezione-t" id="titFuture" hidden data-i18n="stagione.resto">The rest of the calendar</h2>
  <div class="griglia" id="future"></div>
</main>

<footer class="piede"><div class="piede-in"></div></footer>

<script type="module">
import { guscio, dati, datiObbligatori, el, V, identita, coloreDi, dataLoc, guasto, scheletro, t, tn }
  from './muro.mjs?v=190826f';
import { gpNome } from './muro.mjs?v=190826f';
guscio('stagione.html');

const box = document.getElementById('corse');
scheletro(box, 6, 196);

/* Il tracciato in filigrana: lo stesso nastro GPS della pagina-gara, ridotto.
   Si scarica solo per le gare che ce l'hanno, e senza bloccare la scheda. */
async function filigrana(nodo, gara) {
  const p = await dati(`data/pista_${encodeURIComponent(gara)}.json?v=${V}`);
  if (!p) return;
  const [x0, y0, w, h] = p.viewBox;
  const d = 'M' + p.punti.filter((_, i) => i % 3 === 0)
    .map(([x, y]) => `${x.toFixed(0)} ${y.toFixed(0)}`).join('L') + 'Z';
  const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  svg.setAttribute('class', 'disegno');
  svg.setAttribute('viewBox', `${x0 - 20} ${y0 - 20} ${w + 40} ${h + 40}`);
  svg.setAttribute('aria-hidden', 'true');
  svg.innerHTML = `<path d="${d}"/>`;
  nodo.prepend(svg);
}

function scheda(g, corsa, colori, schede, prossima) {
  const vin = g.vincitore;
  const nome = vin && Object.values(schede?.piloti || {}).find(p => p.sigla === vin.sigla)?.nome;
  const attr = {
    class: 'gp' + (corsa ? '' : ' futura') + (prossima ? ' prossima' : ''),
  };
  const figli = [
    el('div', { class: 'capo' },
      el('span', { class: 'rnd' }, t('com.round', { n: String(g.round).padStart(2, '0') })),
      prossima ? el('span', { class: 'etic etic-r' }, t('stagione.prossima')) : null,
      corsa ? null : el('span', { class: 'etic' }, t('stagione.da_correre'))),
    el('h3', {}, gpNome(g.nome)),
    el('p', { class: 'circ' }, g.circuito || ''),
    el('div', { class: 'fondo' },
      corsa && vin
        ? [el('span', { class: 'livrea', stile: { background: coloreDi(vin.team, colori) } }),
           el('span', { class: 'chi' }, nome || vin.sigla)]
        : el('span', { class: 'chi', stile: { color: 'var(--fioco)' } }, tn('com.giro_1', 'com.giri_n', g.giri)),
      el('span', { class: 'quando' }, dataLoc(g.data, { day: '2-digit', month: 'short' }).toUpperCase())),
  ];
  const n = corsa
    ? el('a', { ...attr, href: `gara.html?g=${encodeURIComponent(g.gara_demo)}` }, figli)
    : el('div', attr, figli);
  if (corsa) filigrana(n, g.gara_demo);
  return n;
}

async function boot() {
  try {
    // IL MANIFEST E' OBBLIGATORIO QUANTO IL CALENDARIO. Con `(man || [])` la sua
    // assenza diventava un insieme vuoto: la pagina diceva «0 gare da rivedere» e
    // metteva tutte e 22 le gare fra quelle da correre, senza un errore, senza un
    // Riprova. Non serve cancellare il file: basta una richiesta persa su rete mobile,
    // perche' dati() restituisce null per QUALSIASI guasto. Il progetto ha gia' la sua
    // guardia per questo — datiObbligatori(), «l'assenza e' un guasto: chi chiama vuole
    // saperlo» — e la pagina-gara la usa sullo stesso file.
    const [cal, man, { colori, schede }] = await Promise.all([
      datiObbligatori(`data/calendario_2026.json?v=${V}`),
      datiObbligatori(`data/manifest.json?v=${V}`),
      identita(),
    ]);
    const inDemo = new Set(man.map(r => r.gara));
    const gare = cal.gare || [];
    const oggi = new Date();
    const corse = gare.filter(g => g.gara_demo && inDemo.has(g.gara_demo));
    const future = gare.filter(g => !(g.gara_demo && inDemo.has(g.gara_demo)));

    document.getElementById('conta').replaceChildren(
      el('div', {}, el('b', { class: 'n' }, String(corse.length)), el('span', {}, t('stagione.da_rivedere'))),
      el('div', {}, el('b', { class: 'n' }, String(gare.length)), el('span', {}, t('stagione.nel_calendario'))),
      el('div', {}, el('b', { class: 'n' }, String(corse.reduce((s, g) => s + (g.giri || 0), 0))),
        el('span', {}, t('stagione.giri_disp'))));

    document.getElementById('codaCorse').textContent = t('stagione.n_di_n', { a: corse.length, b: gare.length });
    box.replaceChildren(...corse.slice().reverse()
      .map(g => scheda(g, true, colori, schede, false)));

    if (future.length) {
      document.getElementById('titFuture').hidden = false;
      // «PROSSIMA» SI DECIDE DALLA DATA, non dall'indice 0. Con l'indice, nella
      // finestra fra una gara corsa e la sua pubblicazione il badge finiva su una gara
      // gia' disputata — e senza manifest arrivava a marcare l'Australia di marzo.
      const prossima = future.find(g => g.data && new Date(g.data + 'T23:59:59') >= oggi);
      document.getElementById('future').replaceChildren(
        ...future.map(g => scheda(g, false, colori, schede, g === prossima)));
    }
  } catch (e) {
    guasto(box, boot);
  }
}
boot();
</script>
</body>
