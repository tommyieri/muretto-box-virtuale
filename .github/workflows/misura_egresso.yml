# MISURA, non progetto. Domanda sola: da un runner GitHub il CDN di F1 risponde?
# Il VPS si prende un 403 per indirizzo; se i runner passano, chi scarica puo' stare
# qui e il Mac esce dal percorso critico. Se non passano, si sa e si cerca altrove.
# File temporaneo: o diventa la sonda di prontezza, o si toglie.
name: misura egresso
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:
jobs:
  egresso:
    runs-on: ubuntu-latest
    steps:
      - name: indirizzo di uscita
        run: curl -s --max-time 20 https://api.ipify.org; echo
      - name: livetiming.formula1.com (quello che usa FastF1)
        run: |
          for u in \
            "https://livetiming.formula1.com/static/2026/Index.json" \
            "https://livetiming.formula1.com/static/2026/2026-08-23_Dutch_Grand_Prix/2026-08-21_Practice_1/SessionInfo.json"; do
            printf '%s -> HTTP %s\n' "$u" "$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "$u")"
          done
      - name: FastF1 carica davvero una sessione?
        run: |
          python3 -m pip install --quiet 'fastf1==3.8.3'
          python3 - <<'PY'
          import fastf1, logging, warnings, tempfile
          warnings.filterwarnings('ignore'); logging.getLogger('fastf1').setLevel(logging.ERROR)
          fastf1.Cache.enable_cache(tempfile.mkdtemp())
          try:
              s = fastf1.get_session(2026, 'Netherlands', 'FP1')
              s.load(telemetry=False, weather=False, messages=False)
              print(f'FP1 CARICATA dal runner: {len(s.laps)} giri, {s.laps["Driver"].nunique()} piloti')
          except Exception as e:
              print(f'FP1 NON caricabile dal runner: {type(e).__name__}: {str(e)[:200]}')
              raise SystemExit(1)
          PY
