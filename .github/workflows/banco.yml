# CI del banco — la suite delle sentinelle del simulatore.
#
# PERCHE' STA QUI E NON IN simulatore/.github. GitHub Actions legge i workflow SOLO da
# .github/workflows nella radice del repository: un ci.yml dentro una sottocartella e' un
# file di testo che non esegue niente. Il repo d'origine (tommyieri/muretto-box) lo aveva
# in radice perche' li' il simulatore ERA il repo; qui e' un dipartimento, e il workflow
# va promosso — altrimenti la migrazione avrebbe portato la CI in forma di ornamento,
# che e' esattamente cio' che la regola 4 del progetto vieta.
#
# La suite ESCE 1 se una sola sentinella fallisce (la s03 verifica proprio che il runner
# propaghi l'exit code). Se qui vedi verde, le 25 sentinelle sono verdi davvero.
name: banco

on:
  push:
  pull_request:

jobs:
  suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulatore
    steps:
      - uses: actions/checkout@v4

      - name: Node pinnato (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: simulatore/.nvmrc

      - name: Suite delle sentinelle
        run: node banco/run_suite.mjs

      - name: Manifest dei dati integro (regola 7)
        run: node provenienza/verifica_manifest.mjs

      # I formattatori serviti dal sito (demo/vendor/simulatore/) sono COPIE generate da
      # simulatore/web/. Se qualcuno modifica la copia invece dell'originale — o cambia
      # l'originale senza ri-trasportare — nascono due sorgenti della stessa cosa, che e'
      # l'errore E12 del catalogo (due definizioni di "verde": 37% di divergenza). Questo
      # passo esce 1 sulla deriva, quindi non puo' succedere in silenzio.
      - name: I formattatori del sito non sono derivati
        run: node web/trasporta_formattatori.mjs --verifica

      # Il MOTORE servito a live.html (demo/vendor/simulatore/motore/) e' una copia
      # generata, come i formattatori — con in piu' il contesto_live.json, cioe' le
      # costanti congelate. Se una costante cambia in simulatore/ e nessuno ri-trasporta,
      # la diretta risponde con una taratura e il replay con un'altra: E22 (numeri
      # pubblicati e mai rimisurati dopo un fix). Questo passo esce 1 su quella deriva.
      - name: Il motore servito alla diretta non e' derivato
        run: node web/trasporta_motore.mjs --verifica

  # LA PARITA' FRA DIRETTA E REPLAY. Gira fuori da simulatore/ perche' mette insieme i
  # due lati: il flusso live registrato (live/fixture/) e la vista pre-calcolata
  # (demo/data/vista/). E' il cancello che impedisce alle due pagine di tornare a
  # rispondere con due motori — il difetto che questo repo ha pagato per settimane.
  parita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node pinnato (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: simulatore/.nvmrc

      - name: Il cavo live regge contro la gara vera
        run: node demo/test_live_bylap.mjs

      - name: Diretta e replay rispondono con lo stesso motore
        run: node demo/test_parita_live.mjs
