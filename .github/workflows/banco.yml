# CI del banco — la suite delle sentinelle del simulatore.
#
# PERCHE' STA QUI E NON IN simulatore/.github. GitHub Actions legge i workflow SOLO da
# .github/workflows nella radice del repository: un ci.yml dentro una sottocartella e' un
# file di testo che non esegue niente. Il repo d'origine (tommyieri/muretto-box) lo aveva
# in radice perche' li' il simulatore ERA il repo; qui e' un dipartimento, e il workflow
# va promosso — altrimenti la migrazione avrebbe portato la CI in forma di ornamento,
# che e' esattamente cio' che la regola 4 del progetto vieta.
#
# COSA SIGNIFICA IL VERDE QUI, dal 02/08/2026. La suite esce 1 se una sola asserzione
# rossa NON e' fra quelle dichiarate in simulatore/banco/ROSSE_DICHIARATE.json — e anche
# se una dichiarata guarisce, perche' vorrebbe dire che il referto che la spiega non
# descrive piu' la realta'. Due sentinelle sono rosse per decisione (la banda sotto
# neutralizzazione e il bias piatto mancato per tre millesimi): prima di questa modifica
# la CI era rossa a OGNI push, cioe' muta, e una regressione vera sarebbe arrivata
# indistinguibile dal rumore di fondo. Adesso il verde significa: nessuna regressione, e
# le rosse note sono esattamente quelle che qualcuno ha deciso e messo a referto.
name: banco

on:
  push:
  pull_request:
  # IL GUARDIANO NON PUO' STARE A VALLE DEL GUASTO.
  #
  # Fino al 03/08/2026 questa CI girava SOLO su push e su pull_request. In una pausa fra
  # due gare — e fra oggi e Zandvoort ce ne sono venti giorni — nessuno pusha, quindi s32
  # (che sorveglia gli hash del sigillo dell'holdout) non verifica niente per settimane, e
  # la sonda di deploy vive solo dentro auto_run.sh, cioe' dentro lo script che la macchina
  # che pubblica non sta eseguendo. Il periodo in cui un guasto silenzioso e' PIU' probabile
  # era esattamente quello in cui nessun controllo girava.
  #
  # Ogni mattina alle 6:15 UTC, quindi, anche a repo fermo. Caveat noto di GitHub: i
  # workflow schedulati vengono DISATTIVATI dopo 60 giorni di inattivita' del repo — qui
  # non e' un rischio, ma se un giorno il repo dormisse, la ripartenza va fatta a mano.
  schedule:
    - cron: '15 6 * * *'

jobs:
  suite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulatore
    steps:
      - uses: actions/checkout@v4

      - name: Node pinnato (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: simulatore/.nvmrc

      # PYTHON SERVE DAVVERO, e per due giorni non si e' visto che mancava.
      # Tre sentinelle (s21 mescola, s22 pit-loss, s23 bagnato) provano la
      # RIPRODUCIBILITA' rilanciando gli stimatori — che sono in Python e usano numpy.
      # Senza questo passo `spawnSync('python3', ...)` falliva e quelle tre erano rosse a
      # ogni giro: quattro asserzioni, invisibili perche' la CI era comunque rossa per le
      # due rosse decise. Il 02/08, appena il runner ha imparato a distinguere le rosse
      # dichiarate dalle nuove, sono saltate fuori al primo push. Erano li' da giorni.
      - name: Python per gli stimatori (le sentinelle di riproducibilita' li rilanciano)
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: numpy
        run: pip install --quiet numpy

      - name: Suite delle sentinelle
        run: node banco/run_suite.mjs

      - name: Manifest dei dati integro (regola 7)
        run: node provenienza/verifica_manifest.mjs

      # LA COSTITUZIONE NON PUO' PIU' MENTIRE. CLAUDE.md e' il primo file che ogni
      # sessione legge, e il 02/08/2026 dichiarava rho = 0,0389 mentre il sigillo diceva
      # 0,030776 — piu' altri tre numeri sbagliati: trascritti a mano quando erano
      # giusti, mai rimisurati dopo che il modello lo era stato (E22). Ora la tabella e'
      # GENERATA dai sigilli e questo passo esce 1 sulla deriva, come gia' fanno i due
      # trasporti qui sotto per il codice. Stessa regola, applicata alla prosa.
      - name: I numeri di CLAUDE.md non sono alla deriva dai sigilli
        run: python3 gen_numeri_ereditati.py --verifica

      # I formattatori serviti dal sito (demo/vendor/simulatore/) sono COPIE generate da
      # simulatore/web/. Se qualcuno modifica la copia invece dell'originale — o cambia
      # l'originale senza ri-trasportare — nascono due sorgenti della stessa cosa, che e'
      # l'errore E12 del catalogo (due definizioni di "verde": 37% di divergenza). Questo
      # passo esce 1 sulla deriva, quindi non puo' succedere in silenzio.
      - name: I formattatori del sito non sono derivati
        run: node web/trasporta_formattatori.mjs --verifica

      # Il MOTORE servito a live.html (demo/vendor/simulatore/motore/) e' una copia
      # generata, come i formattatori — con in piu' il contesto_live.json, cioe' le
      # costanti congelate. Se una costante cambia in simulatore/ e nessuno ri-trasporta,
      # la diretta risponde con una taratura e il replay con un'altra: E22 (numeri
      # pubblicati e mai rimisurati dopo un fix). Questo passo esce 1 su quella deriva.
      - name: Il motore servito alla diretta non e' derivato
        run: node web/trasporta_motore.mjs --verifica

      # KPI P1: nessun campo calcolato resta invisibile senza essere dichiarato.
      # Il generatore proietta la vista campo per campo: un campo che smette di essere
      # copiato, o che nessuno legge, non fa rumore — la pagina si disegna lo stesso,
      # senza quella cosa. E' cosi' che `finestra` e' rimasto invisibile per un mese.
      # Il censimento rende la pagina con la vista avvolta in un Proxy e confronta cio'
      # che il generatore emette con cio' che i componenti leggono davvero.
      - name: Nessun campo della vista resta invisibile senza essere dichiarato (P1)
        run: node web/censimento_vista.mjs --verifica

  # LA PARITA' FRA DIRETTA E REPLAY. Gira fuori da simulatore/ perche' mette insieme i
  # due lati: il flusso live registrato (live/fixture/) e la vista pre-calcolata
  # (demo/data/vista/). E' il cancello che impedisce alle due pagine di tornare a
  # rispondere con due motori — il difetto che questo repo ha pagato per settimane.
  parita:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node pinnato (.nvmrc)
        uses: actions/setup-node@v4
        with:
          node-version-file: simulatore/.nvmrc

      - name: Il cavo live regge contro la gara vera
        run: node demo/test_live_bylap.mjs

      # La torre timing consuma dati che arrivano da un WebSocket, cioe' da fuori.
      # Fra i suoi casi c'e' il controllo che nessun campo del feed finisca in
      # innerHTML senza escape: e' nato da un difetto vero trovato il 31/07/2026.
      - name: La torre non mette dati del feed in pagina senza escape
        run: node demo/test_live_timing.mjs

      - name: Diretta e replay rispondono con lo stesso motore
        run: node demo/test_parita_live.mjs

      # LA VOCE EDITORIALE HA LE SUE SENTINELLE, e girano qui perche' il correttore
      # (ai_lab/redazione/stile.py) e' aritmetica pura: nessun LLM, nessuna chiave,
      # nessuna rete. Il caso che vale piu' di tutti e' l'ultimo della suite — il
      # correttore deve conservare il POTERE di bocciare il corpus storico. Il modo
      # naturale di rompere un controllo di stile non e' cancellarlo: e' allargarne
      # le soglie finche' tutto passa, e allora diventa un ornamento. Quella
      # sentinella esce 1 esattamente su quel gesto.
      - name: Le sentinelle della redazione (correttore, memoria, guardia dei numeri)
        run: python3 ai_lab/redazione/test_redazione.py

      # LA STRUTTURA DEL SITO NON AVEVA NESSUN GUARDIANO. Fino al 04/08/2026 questa CI non
      # eseguiva un solo controllo su HTML o CSS: la nav e' ripetuta a mano in quindici
      # file, i footer hanno elenchi diversi fra loro, e una voce dimenticata sarebbe
      # rimasta invisibile per sempre col verde acceso. La sezione Statistiche aggiunge
      # cinque pagine a quel sito. Questa sentinella nasce PRIMA di quelle pagine e verde
      # sullo stato di oggi: le divergenze che gia' esistono stanno in
      # demo/REGISTRO_SEZIONE.json con un referto, e — come per ROSSE_DICHIARATE — il
      # passo esce 1 anche quando una di quelle GUARISCE senza che il registro lo dica.
      - name: La struttura del sito regge (nav, sitemap, letture, artefatti di sezione)
        run: node demo/test_stat.mjs

      # IL DEBITO DEL PERIMETRO PUBBLICATO resta uno specchio. Gli scenari accesi dal PO
      # (PR #64) hanno smesso di essere renderizzati con la migrazione al motore nuovo, e
      # nessun documento lo diceva: una decisione revocata di fatto, in silenzio. Ora e' a
      # registro, e questo passo esce 1 sia se il registro descrive un guasto che non c'e'
      # piu', sia se l'accensione cambia senza che nessuno decida.
      - name: Il registro del debito pubblicato descrive ancora la realtà
        run: node demo/test_debito_demo.mjs

      # LA PAGINA «E SE?» rigioca una gara finita col motore vero nel browser, e ha una
      # DEROGA sorvegliata (s25: soste vere dei rivali = informazione dal futuro,
      # dichiarata in pagina). Questo banco verifica la derivazione delle soste vere,
      # l'arrivo, la pipeline intera col Director, che i bracci si distinguano (A/A) e
      # che l'avvertenza resti resa all'utente. Esce 1 su ognuna di queste.
      - name: La pagina «E se?» rigioca davvero (e resta onesta)
        run: node demo/test_ese.mjs

      # IL RAMO ROSSO DELLA SONDA non era mai scattato in produzione: che segnali davvero
      # era provato solo in laboratorio, a mano. Qui scatta APPOSTA a ogni giro: un sito
      # finto serve versione.json rotte in tre modi (assente, commit sconosciuto, sigillo
      # null) e la sonda deve uscire 1 col messaggio giusto; sulla versione sana deve
      # uscire 0. Esce 1 anche se non riesce a leggere origin/main: muto non e' verde.
      - name: Il ramo rosso della sonda scatta (e il verde tace)
        run: bash scheduling/test_sonda_rosso.sh

      # numpy serve alla sentinella del replay (decodifica e statistiche sugli scarti).
      # `python3 -m pip` e non `pip`: sul runner non e' garantito che siano lo stesso
      # interprete, e installare numpy accanto a un python3 diverso da quello che esegue
      # la sentinella la farebbe fallire per un motivo che non c'entra con i dati.
      - name: numpy per le sentinelle dei dati
        run: python3 -m pip install --quiet numpy

      # IL REPLAY A POSIZIONI VERE non puo' degradare in silenzio. I pallini di gara.html
      # non sono piu' una frazione di TEMPO ma la posizione MISURATA sul GPS per-auto: se
      # un giorno la proiezione sul nastro, l'aggancio al cronometraggio o le tre guardie
      # sul grezzo si rompessero, la pagina continuerebbe a disegnare pallini — solo nel
      # posto sbagliato, che e' il modo peggiore di sbagliare. Cinque cancelli, fra cui
      # lo scarto dalla linea a ogni fine-giro e il divieto di ritirati congelati in pista.
      - name: I pallini stanno dove le vetture erano davvero
        run: python3 test_replay.py

      # LE SAFETY CAR ERANO SPARITE FRA LA SORGENTE E LA PAGINA. gen_rc_feed.py non aveva
      # un ramo per la categoria 'SafetyCar' e 45 messaggi su 45 cadevano fuori: il feed
      # pubblicato aveva 296 voci e ZERO eventi SC, cioe' mancavano gli eventi che
      # decidono le gare, e nessun test se ne accorgeva. Questa sentinella conta i
      # messaggi uno per uno, pretende che due Safety Car nello stesso giro restino due
      # (Gran Bretagna, giro 51) e verifica che l'annuncio del race control e il regime
      # misurato dallo status per-auto si sovrappongano sempre.
      - name: Nessun evento di regime si perde fra il race control e la pagina
        run: python3 test_rc_feed.py

      # UNA DEFINIZIONE DI SOSTA, E RESTA UNA. La vista stint si costruisce sul cambio di
      # SET (demo/sosta.mjs), non sul contatore `stint` grezzo, che avanza a ogni transito
      # in corsia anche senza montare niente: a Monaco disegnerebbe cinque stint dove ce ne
      # sono due. La definizione e' promossa in data/SOSTA_PREREG3.md con accordo ESATTO
      # contro un arbitro indipendente (i campi Compound/TyreLife di FastF1, congelati in
      # data/soste_fastf1_2026.json), e questi due passi sorvegliano quell'accordo: il
      # primo la versione Python, il secondo quella JavaScript che gira in produzione.
      # Girano ENTRAMBI perche' una definizione in due lingue sono due definizioni che
      # aspettano di divergere (E12).
      - name: La definizione di sosta regge contro l'arbitro indipendente (Python)
        run: python3 test_sosta.py --sentinella

      - name: La stessa definizione, in JavaScript, non e' derivata
        run: node demo/test_sosta.mjs
